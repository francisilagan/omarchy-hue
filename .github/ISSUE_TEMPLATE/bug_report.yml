name: Bug report
description: Report a problem with Hue Lights.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not put keys, bridge addresses, or personal data in this report.
        For a security problem, use a private report (see SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the panel.
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: omarchy
    attributes:
      label: Omarchy version
      placeholder: "4.5.0"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Log lines
      description: Paste the related lines from `hue.log`. Remove keys and addresses first.
      render: text
