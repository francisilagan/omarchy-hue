name: Feature request
description: Suggest a change or a new feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem do you want to solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What change do you suggest?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Other options
      description: Describe other ways to solve the problem.
